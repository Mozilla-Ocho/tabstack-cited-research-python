[project]
name = "cited-research"
version = "0.1.0"
description = "One Tabstack /research call in Python: streamed progress, final Markdown report, machine-readable cited sources. Plus a pre-registered evaluation harness."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "tabstack==2.8.5",
    "httpx>=0.27,<1",
]

[project.scripts]
cited-research = "cited_research.cli:main"
cited-research-eval = "cited_research.harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cited_research"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
